<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramen House - Menu Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        jp: ['Noto Sans JP', 'sans-serif'],
                    },
                    colors: {
                        ramen: {
                            50: '#fef3e2',
                            100: '#fde5c5',
                            200: '#fbcf8a',
                            300: '#f9b14d',
                            400: '#f59e0b',
                            500: '#d97706',
                            600: '#b45309',
                            700: '#92400e',
                            800: '#78350f',
                            900: '#451a03',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .slide-up { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .image-hover { transition: transform 0.3s ease; }
        .image-hover:hover { transform: scale(1.05); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .dark .glass {
            background: rgba(17, 24, 39, 0.85);
        }
        .spicy-indicator {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300 font-sans">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-ramen-600 rounded-full flex items-center justify-center text-white text-xl">🍜</div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Ramen House</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400" data-i18n="subtitle">Menu Digital</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleLanguage()" class="px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-800 text-sm font-medium hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                    <span id="lang-btn">🇵🇹 PT</span>
                </button>
                <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition" aria-label="Toggle dark mode">
                    <span id="theme-icon">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Filters -->
    <div class="max-w-4xl mx-auto px-4 py-4">
        <div class="flex gap-2 overflow-x-auto scrollbar-hide pb-2">
            <button onclick="filterCategory('all')" class="filter-btn active px-4 py-2 rounded-full bg-ramen-600 text-white text-sm font-medium whitespace-nowrap transition" data-category="all" data-i18n="all">Todos</button>
            <button onclick="filterCategory('classic')" class="filter-btn px-4 py-2 rounded-full bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-sm font-medium whitespace-nowrap transition hover:bg-gray-300 dark:hover:bg-gray-700" data-category="classic" data-i18n="classic">Classic</button>
            <button onclick="filterCategory('specialty')" class="filter-btn px-4 py-2 rounded-full bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-sm font-medium whitespace-nowrap transition hover:bg-gray-300 dark:hover:bg-gray-700" data-category="specialty" data-i18n="specialty">Specialty</button>
        </div>
    </div>

    <!-- Menu Grid -->
    <main class="max-w-4xl mx-auto px-4 pb-24">
        <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Items injected by JS -->
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="absolute bottom-0 left-0 right-0 sm:top-1/2 sm:left-1/2 sm:bottom-auto sm:right-auto sm:-translate-x-1/2 sm:-translate-y-1/2 sm:w-full sm:max-w-lg bg-white dark:bg-gray-900 rounded-t-2xl sm:rounded-2xl overflow-hidden slide-up shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="relative">
                <img id="modal-img" src="" alt="" class="w-full h-64 sm:h-72 object-cover">
                <button onclick="closeModal()" class="absolute top-3 right-3 w-8 h-8 bg-black/50 text-white rounded-full flex items-center justify-center text-lg hover:bg-black/70 transition">✕</button>
                <div id="modal-spicy" class="absolute top-3 left-3 bg-red-600 text-white px-3 py-1 rounded-full text-sm font-bold hidden">🌶️ <span data-i18n="spicy">Picante</span></div>
            </div>
            <div class="p-5">
                <div class="flex justify-between items-start mb-2">
                    <h2 id="modal-title" class="text-2xl font-bold"></h2>
                    <span id="modal-price" class="text-xl font-bold text-ramen-600"></span>
                </div>
                <p id="modal-desc" class="text-gray-600 dark:text-gray-400 mb-4"></p>
                <div class="border-t border-gray-200 dark:border-gray-700 pt-4">
                    <h3 class="font-semibold mb-2 text-sm uppercase tracking-wider text-gray-500 dark:text-gray-400" data-i18n="ingredients">Ingredientes</h3>
                    <div id="modal-ingredients" class="flex flex-wrap gap-2"></div>
                </div>
                <div class="mt-4 p-3 bg-ramen-50 dark:bg-ramen-900/30 rounded-lg">
                    <p class="text-sm text-ramen-800 dark:text-ramen-200" data-i18n="allergen-note">⚠️ Contém: glúten, ovos, soja. Pergunte ao staff sobre outros alergénios.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- QR Section (for printing) -->
    <div class="max-w-4xl mx-auto px-4 py-8 border-t border-gray-200 dark:border-gray-700 mt-8">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm text-center">
            <h2 class="text-lg font-bold mb-2" data-i18n="qr-title">📱 Aceda ao Menu Digital</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-4" data-i18n="qr-desc">Aponte a câmara do telemóvel para este QR Code</p>
            <div id="qrcode" class="flex justify-center mb-3"></div>
            <p class="text-xs text-gray-400" data-i18n="qr-tip">Imprima esta secção e coloque nas mesas</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto px-4 py-6 text-center text-sm text-gray-500 dark:text-gray-400">
        <p data-i18n="footer">Ramen House • Menu Interativo • 2026</p>
    </footer>

    <script>
        // Data
        const menuData = [
            {
                id: 1,
                name: { pt: "Shoyu Ramen", en: "Shoyu Ramen", jp: "醤油ラーメン" },
                category: "classic",
                price: 12.50,
                description: { 
                    pt: "Caldo à base de soja, chashu pork, ovo mollete, cebolinho", 
                    en: "Soy-based broth, chashu pork, soft egg, scallions",
                    jp: "醤油ベースのスープ、チャーシュー、半熟卵、ネギ"
                },
                ingredients: ["soja", "chashu", "ovo", "cebolinho", "macarrão"],
                image: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=600&h=600&fit=crop",
                spicy: false
            },
            {
                id: 2,
                name: { pt: "Miso Ramen", en: "Miso Ramen", jp: "味噌ラーメン" },
                category: "classic",
                price: 13.00,
                description: { 
                    pt: "Caldo rico de miso, carne de porco moída, milho, manteiga", 
                    en: "Rich miso broth, ground pork, corn, butter",
                    jp: "濃厚味噌スープ、ひき肉、コーン、バター"
                },
                ingredients: ["miso", "porco", "milho", "manteiga", "ovo", "macarrão"],
                image: "https://kimi-web-img.moonshot.cn/img/hikarimiso.com/5c57b136c0d419da0150e213685a92d2f589ebe0.jpg",
                spicy: false
            },
            {
                id: 3,
                name: { pt: "Tonkotsu Ramen", en: "Tonkotsu Ramen", jp: "豚骨ラーメン" },
                category: "classic",
                price: 14.50,
                description: { 
                    pt: "Caldo cremoso de ossos de porco, chashu, óleo de alho negro", 
                    en: "Creamy pork bone broth, chashu, black garlic oil",
                    jp: "クリーミーな豚骨スープ、チャーシュー、黒ニンニク油"
                },
                ingredients: ["ossos de porco", "chashu", "alho negro", "ovo", "macarrão"],
                image: "https://kimi-web-img.moonshot.cn/img/cdn.apartmenttherapy.info/dbfdd754cd1edf5a0815282ea9a9f5eb8e5a3f71",
                spicy: false
            },
            {
                id: 4,
                name: { pt: "Shio Ramen", en: "Shio Ramen", jp: "塩ラーメン" },
                category: "classic",
                price: 12.00,
                description: { 
                    pt: "Caldo leve de sal, frango, rebentos de bambu", 
                    en: "Light salt broth, chicken, bamboo shoots",
                    jp: "あっさり塩スープ、鶏肉、メンマ"
                },
                ingredients: ["sal", "frango", "bambu", "ovo", "macarrão"],
                image: "https://kimi-web-img.moonshot.cn/img/www.justonecookbook.com/935e007cc2b5fbd73c7ed2189b48c5db31444cf6.jpg",
                spicy: false
            },
            {
                id: 5,
                name: { pt: "Spicy Tan Tanmen", en: "Spicy Tan Tanmen", jp: "坦々麺" },
                category: "specialty",
                price: 15.00,
                description: { 
                    pt: "Caldo de gergelim com chili, porco moído, bok choy", 
                    en: "Sesame chili broth, minced pork, bok choy",
                    jp: "ごま唐辛子スープ、ひき肉、青梗菜"
                },
                ingredients: ["gergelim", "chili", "porco", "bok choy", "macarrão"],
                image: "https://kimi-web-img.moonshot.cn/img/norecipes.com/cd7e048ed1add2c073974b50db430a2ef89f249e.jpg",
                spicy: true
            },
            {
                id: 6,
                name: { pt: "Black Garlic Ramen", en: "Black Garlic Ramen", jp: "黒ニンニクラーメン" },
                category: "specialty",
                price: 15.50,
                description: { 
                    pt: "Base tonkotsu, óleo de alho negro torrado, chalotas crocantes", 
                    en: "Tonkotsu base, roasted garlic oil, crispy shallots",
                    jp: "豚骨ベース、炙り黒ニンニク油、カリカリエシャロット"
                },
                ingredients: ["tonkotsu", "alho negro", "chalotas", "ovo", "macarrão"],
                image: "https://kimi-web-img.moonshot.cn/img/iloveblackgarlic.com/58ae1fd79ba8084fdeb39e2b295c30c88013f974.jpg",
                spicy: false
            },
            {
                id: 7,
                name: { pt: "Tokyo Chicken Ramen", en: "Tokyo Chicken Ramen", jp: "東京鶏ラーメン" },
                category: "specialty",
                price: 13.50,
                description: { 
                    pt: "Caldo claro de frango, frango grelhado, nori", 
                    en: "Clear chicken broth, grilled chicken, nori",
                    jp: "透き通った鶏スープ、炙り鶏肉、海苔"
                },
                ingredients: ["frango", "caldo claro", "nori", "cebolinho", "macarrão"],
                image: "https://images.unsplash.com/photo-1614563637806-1d0e645e0940?w=600&h=600&fit=crop",
                spicy: false
            },
            {
                id: 8,
                name: { pt: "Firecracker Ramen 🔥", en: "Firecracker Ramen 🔥", jp: "ファイヤークラッカーラーメン 🔥" },
                category: "specialty",
                price: 14.00,
                description: { 
                    pt: "Caldo extra picante, óleo de chili, jalapeño", 
                    en: "Extra spicy broth, chili oil, jalapeño",
                    jp: "激辛スープ、ラー油、ハラペーニョ"
                },
                ingredients: ["chili", "jalapeño", "óleo picante", "macarrão", "ovo"],
                image: "https://images.unsplash.com/photo-1591814468924-caf88d1232e1?w=600&h=600&fit=crop",
                spicy: true
            }
        ];

        // State
        let currentLang = 'pt';
        let currentCategory = 'all';
        let isDark = false;

        // Translations
        const i18n = {
            pt: {
                subtitle: "Menu Digital",
                all: "Todos",
                classic: "Classic",
                specialty: "Specialty",
                spicy: "Picante",
                ingredients: "Ingredientes",
                "allergen-note": "⚠️ Contém: glúten, ovos, soja. Pergunte ao staff sobre outros alergénios.",
                "qr-title": "📱 Aceda ao Menu Digital",
                "qr-desc": "Aponte a câmara do telemóvel para este QR Code",
                "qr-tip": "Imprima esta secção e coloque nas mesas",
                footer: "Ramen House • Menu Interativo • 2026",
                "tap-to-see": "Toque para ver detalhes"
            },
            en: {
                subtitle: "Digital Menu",
                all: "All",
                classic: "Classic",
                specialty: "Specialty",
                spicy: "Spicy",
                ingredients: "Ingredients",
                "allergen-note": "⚠️ Contains: gluten, eggs, soy. Ask staff about other allergens.",
                "qr-title": "📱 Access Digital Menu",
                "qr-desc": "Point your phone camera at this QR Code",
                "qr-tip": "Print this section and place on tables",
                footer: "Ramen House • Interactive Menu • 2026",
                "tap-to-see": "Tap to see details"
            },
            jp: {
                subtitle: "デジタルメニュー",
                all: "全て",
                classic: "クラシック",
                specialty: "スペシャル",
                spicy: "辛口",
                ingredients: "具材",
                "allergen-note": "⚠️ アレルギー物質：小麦、卵、大豆。その他はスタッフにお尋ねください。",
                "qr-title": "📱 デジタルメニューへ",
                "qr-desc": "スマートフォンのカメラでQRコードを読み取ってください",
                "qr-tip": "このセクションを印刷してテーブルに置いてください",
                footer: "Ramen House • インタラクティブメニュー • 2026",
                "tap-to-see": "タップして詳細を見る"
            }
        };

        // Functions
        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            const filtered = currentCategory === 'all' 
                ? menuData 
                : menuData.filter(item => item.category === currentCategory);

            grid.innerHTML = filtered.map(item => `
                <div class="bg-white dark:bg-gray-800 rounded-2xl overflow-hidden shadow-sm hover:shadow-lg transition-shadow cursor-pointer fade-in" onclick="openModal(${item.id})">
                    <div class="relative overflow-hidden h-48">
                        <img src="${item.image}" alt="${item.name[currentLang]}" class="w-full h-full object-cover image-hover" loading="lazy">
                        ${item.spicy ? '<div class="absolute top-2 left-2 bg-red-600 text-white px-2 py-1 rounded-full text-xs font-bold">🌶️</div>' : ''}
                        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/60 to-transparent p-3">
                            <span class="text-white font-bold text-lg">${item.price.toFixed(2)}€</span>
                        </div>
                    </div>
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="font-bold text-lg">${item.name[currentLang]}</h3>
                        </div>
                        <p class="text-sm text-gray-600 dark:text-gray-400 line-clamp-2">${item.description[currentLang]}</p>
                        <p class="text-xs text-ramen-500 mt-2 font-medium" data-i18n="tap-to-see">${i18n[currentLang]['tap-to-see']}</p>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.category === category) {
                    btn.classList.add('bg-ramen-600', 'text-white');
                    btn.classList.remove('bg-gray-200', 'dark:bg-gray-800', 'text-gray-700', 'dark:text-gray-300');
                } else {
                    btn.classList.remove('bg-ramen-600', 'text-white');
                    btn.classList.add('bg-gray-200', 'dark:bg-gray-800', 'text-gray-700', 'dark:text-gray-300');
                }
            });
            renderMenu();
        }

        function openModal(id) {
            const item = menuData.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modal-img').src = item.image;
            document.getElementById('modal-title').textContent = item.name[currentLang];
            document.getElementById('modal-price').textContent = item.price.toFixed(2) + '€';
            document.getElementById('modal-desc').textContent = item.description[currentLang];
            document.getElementById('modal-spicy').classList.toggle('hidden', !item.spicy);

            const ingContainer = document.getElementById('modal-ingredients');
            ingContainer.innerHTML = item.ingredients.map(ing => 
                `<span class="px-3 py-1 bg-gray-100 dark:bg-gray-700 rounded-full text-sm">${ing}</span>`
            ).join('');

            document.getElementById('modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function toggleLanguage() {
            const langs = ['pt', 'en', 'jp'];
            const currentIndex = langs.indexOf(currentLang);
            currentLang = langs[(currentIndex + 1) % langs.length];

            const flags = { pt: '🇵🇹 PT', en: '🇬🇧 EN', jp: '🇯🇵 JP' };
            document.getElementById('lang-btn').textContent = flags[currentLang];

            // Update all i18n elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (i18n[currentLang][key]) {
                    el.textContent = i18n[currentLang][key];
                }
            });

            renderMenu();
        }

        function toggleDarkMode() {
            isDark = !isDark;
            document.documentElement.classList.toggle('dark', isDark);
            document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('darkMode', isDark);
        }

        function generateQR() {
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            const currentUrl = window.location.href;
            new QRCode(qrContainer, {
                text: currentUrl,
                width: 128,
                height: 128,
                colorDark: isDark ? "#ffffff" : "#000000",
                colorLight: isDark ? "#1f2937" : "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            // Check system dark mode preference
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                isDark = true;
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').textContent = '☀️';
            }

            // Check localStorage
            const savedDark = localStorage.getItem('darkMode');
            if (savedDark !== null) {
                isDark = savedDark === 'true';
                document.documentElement.classList.toggle('dark', isDark);
                document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
            }

            renderMenu();
            generateQR();

            // Close modal on Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
        });
    </script>
</body>
</html>
